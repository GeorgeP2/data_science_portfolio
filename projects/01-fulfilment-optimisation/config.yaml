# Project configuration — keep every tunable value here, not in code.
seed: 42

# Paths are relative to the project's data/ directory.
data:
  kit: raw/kit
  henn_waescher: raw/henn_waescher
  foodmart: raw/foodmart
  processed: processed

# Per-solver settings, passed to the solver's constructor.
solvers:
  seed:
    seed_rule: most_aisles  # de Koster et al. (1999)
    addition_rule: fewest_new_aisles
  alns:  # Ropke & Pisinger (2006); see solvers/alns.py
    max_iterations: 20000  # stop here if the deadline doesn't come first
    remove_min: 2  # orders removed: uniform in [remove_min, min(remove_max, fraction * n)]
    remove_max_fraction: 0.3
    remove_max: 30  # absolute cap, so iterations stay fast on large requests
    determinism: 4.0  # randomisation of worst/related removal (higher = greedier)
    start_worse_accept: 0.05  # start temperature accepts 5% worse with probability 0.5
    cooling: 0.9995  # temperature multiplier per iteration
    segment_length: 100  # iterations between weight updates
    reaction: 0.1
    scores: [33, 9, 13]  # new best, improved current, accepted worse
    cache_size: 200000  # batch-cost cache entries before it is cleared
  cp_sat:  # set partitioning over a candidate pool; see solvers/cp_sat.py
    pool_fraction: 0.5  # share of the budget ALNS spends building the pool
    pool_iterations: 5000  # ALNS iteration cap for the pool (bounds it with no deadline)
    enumerate_up_to: 12  # instances with at most this many orders get every feasible subset
    workers: 4  # CP-SAT search workers
    cost_scale: 1000  # distances x this, rounded, for CP-SAT's integer objective
    deadline_margin: 0.05  # seconds held back from CP-SAT's time limit (covers post-solve work)

# Grid for `python -m fulfilment_optimisation.benchmark`: every combination is one run.
benchmark:
  instance_sets: [henn_waescher]
  solvers: [fcfs, seed, savings, alns, cp_sat]
  routers: [s_shape, largest_gap, optimal]
  time_limits: [1.0]  # seconds
  seeds: [0]
  workers: 4

# POST /batch service limits and preset layouts.
api:
  max_orders: 500
  max_budget_ms: 10000
  response_margin_ms: 30  # held back from budget_ms for FCFS, the response and serialisation
  solver_threads: 4  # concurrent solves; extra requests wait, then fall back to FCFS
  gc_after_response: true  # collect garbage between requests, not during them (see api/app.py)
  layouts:
    # Henn & Wäscher (2012) layout, as the parser reads it from the OBSP setting files.
    henn_waescher:
      n_aisles: 10
      n_positions: 45
      location_length: 1.0
      aisle_spacing: 5.0
      end_offset: 1.0
      depot_offset: 1.0

# T15 distance check: `python -m fulfilment_optimisation.published`. Henn & Wäscher (FEMM 07/2010,
# Tables 9.2 and 9.5) publish each method's improvement of the average tour length over C&W(ii)
# per class (orders, capacity, routing), on their own randomly generated instances from the same
# generator. Only the classes shared with our instances are compared (40/60/80 orders x 45/75).
# Tolerance set before looking at per-class results; the overall averages had been seen
# (ALNS over savings at 1 s: 4.4% S-shape, 2.8% largest gap, against ABHC 4.6% for both).
published:
  reference_method: abhc  # their best method; within 0.1-1.4% of optimal (Tables 9.3, 9.6)
  solvers: [alns, cp_sat]
  # Pass if our improvement over savings is at most this many percentage points below theirs.
  # The instances differ (12 per class here vs 40, depot 1 LU vs 0.5 LU), so class means carry
  # sampling noise; the 95% bootstrap interval is reported alongside.
  tolerance_pp: 1.0
  bootstrap_samples: 2000

# Instance generator (T18, T19). Ranges come from T17's KIT profile:
# docs/projects/p1-fulfilment-optimisation/results/kit_profile.md (python -m ...kit_profile).
generator:
  layout:
    aisles: [4, 40]  # KIT: 4 to 40 across settings (LHS design spans 5-40, OFAT adds 4)
    locations_per_aisle: [5, 40]  # KIT: 5 to 40, independent of the aisle count (r = -0.11)
    # KIT distances are abstract units, so the geometry is Henn & Wäscher's (FEMM 07/2010,
    # section 6.1), keeping generated layouts comparable with the benchmark instances.
    location_length: 1.0
    aisle_spacing: 5.0
    end_offset: 1.0
    depot_offset: 1.0
  # Seeds are split so tuning never sees the instances the final numbers (T21) are reported on.
  development_seeds: [0, 9999]
  held_out_seeds: [10000, 10999]
  # Order-size presets: lines per order (one unit each) and the picker capacity that goes with them.
  order_sizes:
    kit:  # T17: KIT's default mix; the capacity is assumed (KIT has none): about 16 orders a tour
      lines: [1, 2, 3]
      weights: [0.8, 0.15, 0.05]
      capacity: 20
    henn_waescher:  # 5-25 items uniformly, 2-5 orders a tour (Henn & Wäscher, section 6.2)
      lines: [5, 25]  # inclusive range
      capacity: 45
  # Named scenarios. Unset keys fall back to `baseline`.
  scenarios:
    baseline:  # KIT's standard case
      orders_per_shift: 1000
      arrivals: {process: poisson}
      order_size: kit
      popularity: abc
      affinity: 0.0
      cluster_size: 8
      storage_policy: random
      due_dates: {rule: shift_end}
    peak_day:  # KIT's highest volume with its strongest waves
      orders_per_shift: 2000
      arrivals: {process: waves, num_waves: 5, stochasticity: 1.0}
    high_affinity:  # not in KIT: most next lines come from the previous line's cluster, and
      affinity: 0.8   # clusters are stored together (correlated storage)
      storage_policy: clustered
    tight_due_dates:  # KIT's tightest OFAT rule
      due_dates: {rule: relative, offset_seconds: 600}
    henn_waescher_like:  # benchmark-sized orders on generated layouts, for batching comparisons
      orders_per_shift: 60
      order_size: henn_waescher
      storage_policy: A_to_X  # their class-based storage puts A articles in the first aisle
